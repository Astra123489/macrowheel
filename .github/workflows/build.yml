name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-studio:
    name: Build Studio (Windows)
    runs-on: windows-latest

    defaults:
      run:
        working-directory: studio

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      # `flutter analyze` exits non-zero for info-level lints as well as
      # errors. Errors still fail the job; info-level churn from newer Flutter
      # releases does not.
      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test --reporter expanded

      - name: Build Windows release
        run: flutter build windows --release

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: macro_wheel_studio-windows
          path: studio/build/windows/x64/runner/Release/
          if-no-files-found: error