name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-studio:
    name: Build Studio (Windows)
    runs-on: windows-latest

    defaults:
      run:
        working-directory: studio

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      # `flutter analyze` exits non-zero for info- and warning-level findings
      # as well as for errors. Errors still fail the job; info/warning churn
      # from newer Flutter releases does not.
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run tests
        run: flutter test --reporter expanded

      - name: Build Windows release
        run: flutter build windows --release

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: macro_wheel_studio-windows
          path: studio/build/windows/x64/runner/Release/
          if-no-files-found: error

  build-menu:
    name: Build Menu (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.0'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true

      # The embedded Python runtimes are gitignored, so a plain checkout
      # configures and builds without them (CMakeLists guards each copy with
      # if(EXISTS)). They are fetched only in the release workflow, where the
      # installer genuinely needs them.
      - name: Configure
        shell: pwsh
        working-directory: menu
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_PREFIX_PATH="$env:Qt6_DIR"

      - name: Build
        shell: pwsh
        working-directory: menu
        run: cmake --build build --config Release

      - name: Verify the executable was produced
        shell: pwsh
        run: |
          $exe = 'menu/build/Release/MacroWheelMenu.exe'
          if (-not (Test-Path $exe)) { throw "Menu executable not produced: $exe" }
          Write-Host "Built $exe"