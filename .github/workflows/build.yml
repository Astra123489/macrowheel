name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-studio:
    name: Build Studio (Windows)
    runs-on: windows-latest

    defaults:
      run:
        working-directory: studio

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      # `flutter analyze` exits non-zero for info- and warning-level findings
      # as well as for errors. Errors still fail the job; info/warning churn
      # from newer Flutter releases does not.
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run tests
        run: flutter test --reporter expanded

      - name: Build Windows release
        run: flutter build windows --release

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: macro_wheel_studio-windows
          path: studio/build/windows/x64/runner/Release/
          if-no-files-found: error

  build-menu:
    name: Build Menu (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.0'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true

      # The embedded Python runtimes are gitignored, so a plain checkout
      # configures and builds without them (CMakeLists guards each copy with
      # if(EXISTS)). They are fetched only in the release workflow, where the
      # installer genuinely needs them.
      #
      # Configuration goes through menu/tools/configure-menu.ps1 so this job
      # and the release job cannot drift apart. That script resolves the Qt
      # prefix and pins the Visual Studio generator only when it exists on the
      # runner.
      - name: Configure
        shell: pwsh
        run: ./menu/tools/configure-menu.ps1

      - name: Build
        shell: pwsh
        run: cmake --build menu/build --config Release

      # The output directory depends on the generator CMake selected, so the
      # executable is located rather than assumed to be under Release/.
      - name: Verify the executable was produced
        shell: pwsh
        run: |
          $exe = Get-ChildItem menu/build -Recurse -Filter 'MacroWheelMenu.exe' -ErrorAction SilentlyContinue |
                 Select-Object -First 1
          if (-not $exe) { throw 'Menu executable was not produced.' }
          Write-Host "Built $($exe.FullName)"