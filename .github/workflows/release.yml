name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, without the leading v (e.g. 0.1.0). The release is created against v<version>.'
        required: true
        type: string

permissions:
  contents: write

jobs:
  # `latest.json` describes the Macro Wheel Menu. The only consumer is the
  # Menu's own updater (menu/src/main.cpp), which polls
  # releases/latest/download/latest.json and expects a Menu installer plus its
  # SHA-256. Studio has no updater, so it ships as a plain release asset with
  # no manifest of its own.
  release-menu:
    name: Release Menu (Windows)
    runs-on: windows-latest

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          # Pushing a v* tag is the normal path.
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $v = $env:GITHUB_REF.Substring('refs/tags/v'.Length)
          } else {
            # A manual dispatch has no tag ref. Without one the release step
            # fails after the entire build has already run, so the version is
            # required up front and is used as the tag name.
            $v = '${{ inputs.version }}'
            if (-not $v) {
              throw 'workflow_dispatch requires the "version" input, or push a v* tag instead.'
            }
          }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Version: $v"

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.0'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true

      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis --no-progress -y
          "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Append

      # The installer must carry both embedded runtimes, so they have to be
      # present before the install rules are evaluated.
      - name: Fetch embedded Python runtimes
        shell: pwsh
        run: ./menu/tools/fetch-python-runtimes.ps1

      # Same configuration path as the build workflow, so the two cannot drift.
      # The version is forwarded into CPack so a tagged build is not stuck on
      # the hardcoded project version.
      - name: Configure
        shell: pwsh
        run: ./menu/tools/configure-menu.ps1 -Version '${{ steps.version.outputs.version }}'

      - name: Build
        shell: pwsh
        run: cmake --build menu/build --config Release

      # Install into a scratch prefix and assert the files the application
      # needs in order to start are present. This exists because v0.1.0
      # shipped an installer whose install tree contained every Qt library
      # except Qt6Widgets.dll: windeployqt could not see the Qt.labs.platform
      # import (the QML is compiled into the binary), so it never learned the
      # plugin depends on QtWidgets. The built application was fine; only the
      # packaged one was broken, and that was discovered by a user rather than
      # by CI. Checking here turns that into a failed release instead.
      - name: Verify the install tree is complete
        shell: pwsh
        run: |
          $prefix = Join-Path $env:RUNNER_TEMP 'mw-verify-install'
          cmake --install menu/build --config Release --prefix $prefix
          if ($LASTEXITCODE -ne 0) { throw 'cmake --install failed.' }

          # Every entry is a file whose absence makes the installed
          # application fail to start or lose functionality.
          $required = @(
            'bin/MacroWheelMenu.exe',
            'bin/Qt6Core.dll',
            'bin/Qt6Gui.dll',
            'bin/Qt6Qml.dll',
            'bin/Qt6Quick.dll',
            'bin/Qt6Widgets.dll',
            'plugins/platforms/qwindows.dll',
            'qml/QtQml/qmldir',
            'qml/QtQuick/qmldir',
            'qml/Qt/labs/platform/qmldir',
            'qml/Qt/labs/platform/labsplatformplugin.dll',
            'bin/command_runtime/python.exe',
            'bin/script_runtime/python.exe'
          )

          $missing = @()
          foreach ($rel in $required) {
            $full = Join-Path $prefix $rel
            if (-not (Test-Path $full)) { $missing += $rel }
          }

          if ($missing.Count -gt 0) {
            Write-Host 'Install tree is incomplete:'
            $missing | ForEach-Object { Write-Host "  MISSING $_" }
            throw "Installer would ship without $($missing.Count) required file(s)."
          }
          Write-Host "Install tree verified: $($required.Count) required files present."

      - name: Package installer
        id: package
        shell: pwsh
        working-directory: menu/build
        run: |
          cpack -G NSIS -C Release
          $installer = Get-ChildItem -Filter 'MacroWheelMenu-*-windows-x64.exe' -ErrorAction SilentlyContinue |
                       Select-Object -First 1
          if (-not $installer) {
            Get-ChildItem -Filter '*.exe' | ForEach-Object { Write-Host "found: $($_.Name)" }
            throw 'Installer was not produced.'
          }
          $sha = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLower()
          "asset_name=$($installer.Name)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "sha256=$sha" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Installer: $($installer.FullName)"

      - name: Generate latest.json
        shell: pwsh
        working-directory: menu/build
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $asset = '${{ steps.package.outputs.asset_name }}'
          $sha = '${{ steps.package.outputs.sha256 }}'
          $url = "https://github.com/${{ github.repository }}/releases/download/v$version/$asset"
          $manifest = [ordered]@{
            version = $version
            notes   = "Macro Wheel Menu $version"
            assets  = [ordered]@{
              windows = [ordered]@{ url = $url; sha256 = $sha }
            }
          }
          $manifest | ConvertTo-Json -Depth 6 | Set-Content -Path 'latest.json' -Encoding UTF8

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # Explicit, so a manual dispatch (which has no tag ref) still creates
          # the release against v<version> rather than failing with
          # "GitHub Releases requires a tag".
          tag_name: v${{ steps.version.outputs.version }}
          files: |
            menu/build/MacroWheelMenu-${{ steps.version.outputs.version }}-windows-x64.exe
            menu/build/latest.json
          generate_release_notes: true

  # Studio has no updater, so it publishes a plain archive and no manifest.
  # `needs` serialises the two uploads so they do not race to create the same
  # release.
  release-studio:
    name: Release Studio (Windows)
    runs-on: windows-latest
    needs: release-menu

    defaults:
      run:
        working-directory: studio

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows release
        run: flutter build windows --release

      - name: Package Studio
        shell: pwsh
        working-directory: studio
        run: |
          $name = 'MacroWheelStudio-windows.zip'
          $src = 'build/windows/x64/runner/Release'
          if (-not (Test-Path $src)) { throw "Release build not found at $src" }
          Compress-Archive -Path "$src/*" -DestinationPath $name -Force

      - name: Upload Studio to the release
        uses: softprops/action-gh-release@v2
        with:
          # Same tag the Menu job released against. On a tag push this matches
          # the pushed tag; on a manual dispatch it is the required input.
          tag_name: v${{ needs.release-menu.outputs.version }}
          files: studio/MacroWheelStudio-windows.zip