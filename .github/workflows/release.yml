name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # `latest.json` describes the Macro Wheel Menu. The only consumer is the
  # Menu's own updater (menu/src/main.cpp), which polls
  # releases/latest/download/latest.json and expects a Menu installer plus its
  # SHA-256. Studio has no updater, so it ships as a plain release asset with
  # no manifest of its own.
  release-menu:
    name: Release Menu (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $v = $env:GITHUB_REF.Substring('refs/tags/v'.Length)
          } else {
            $v = '0.0.0'
          }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.0'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true

      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis --no-progress -y
          "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Append

      # The installer must carry both embedded runtimes, so they have to be
      # present before the install rules are evaluated.
      - name: Fetch embedded Python runtimes
        shell: pwsh
        run: ./menu/tools/fetch-python-runtimes.ps1

      - name: Configure
        shell: pwsh
        working-directory: menu
        run: |
          $version = '${{ steps.version.outputs.version }}'
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_PREFIX_PATH="$env:Qt6_DIR" `
            -DCPACK_PACKAGE_VERSION="$version" `
            -DCPACK_PACKAGE_FILE_NAME="MacroWheelMenu-$version-windows-x64"

      - name: Build
        shell: pwsh
        working-directory: menu
        run: cmake --build build --config Release

      - name: Package installer
        id: package
        shell: pwsh
        working-directory: menu/build
        run: |
          cpack -G NSIS -C Release
          $name = "MacroWheelMenu-${{ steps.version.outputs.version }}-windows-x64.exe"
          if (-not (Test-Path $name)) {
            Get-ChildItem -Filter '*.exe' | ForEach-Object { Write-Host "found: $($_.Name)" }
            throw "Expected installer not produced: $name"
          }
          $sha = (Get-FileHash $name -Algorithm SHA256).Hash.ToLower()
          "asset_name=$name" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "sha256=$sha" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Generate latest.json
        shell: pwsh
        working-directory: menu/build
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $asset = '${{ steps.package.outputs.asset_name }}'
          $sha = '${{ steps.package.outputs.sha256 }}'
          $url = "https://github.com/${{ github.repository }}/releases/download/v$version/$asset"
          $manifest = [ordered]@{
            version = $version
            notes   = "Macro Wheel Menu $version"
            assets  = [ordered]@{
              windows = [ordered]@{ url = $url; sha256 = $sha }
            }
          }
          $manifest | ConvertTo-Json -Depth 6 | Set-Content -Path 'latest.json' -Encoding UTF8

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            menu/build/MacroWheelMenu-${{ steps.version.outputs.version }}-windows-x64.exe
            menu/build/latest.json
          generate_release_notes: true

  # Studio has no updater, so it publishes a plain archive and no manifest.
  # `needs` serialises the two uploads so they do not race to create the same
  # release.
  release-studio:
    name: Release Studio (Windows)
    runs-on: windows-latest
    needs: release-menu

    defaults:
      run:
        working-directory: studio

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows release
        run: flutter build windows --release

      - name: Package Studio
        shell: pwsh
        working-directory: studio
        run: |
          $name = 'MacroWheelStudio-windows.zip'
          $src = 'build/windows/x64/runner/Release'
          if (-not (Test-Path $src)) { throw "Release build not found at $src" }
          Compress-Archive -Path "$src/*" -DestinationPath $name -Force

      - name: Upload Studio to the release
        uses: softprops/action-gh-release@v2
        with:
          files: studio/MacroWheelStudio-windows.zip