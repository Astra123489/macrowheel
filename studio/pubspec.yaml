name: macro_wheel_studio
description: Macro Wheel Studio — configuration editor for Macro Wheel.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  path: ^1.9.0
  path_provider: ^2.1.4
  file_selector: ^1.0.3
  uuid: ^4.4.2
  collection: ^1.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  # Studio ships no image assets yet; icons come from the Material font, which
  # uses-material-design provides. Declaring an asset directory here makes
  # `flutter analyze` emit asset_directory_does_not_exist on a fresh checkout,
  # because git does not track empty directories.
  uses-material-design: true